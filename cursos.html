    <section class="hero d-flex align-items-center text-white">
        <div class="container-fluid px-5">
            <h1 class="display-3 fw-bold mb-3">Catalogo de cursos</h1>
            <p class="lead mb-4" style="max-width: 600px;">
                Encuentra el curso perfecto.
            </p>
        </div>
    </section>

    <form action="/buscar" method="get" id="form-busqueda">
        <div class="form-field mx-auto buscador-flotante">
            <label class="form-control form-adorn">
                <div class="form-adorn-icon" aria-hidden="true">
                    <i class="bi bi-search"></i>
                </div>
                <input type="search" class="form-ghost" placeholder="Buscar...">
            </label>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-3 justify-content-center">

            <input type="checkbox" class="btn-check" id="chip-programacion" name="materia" value="programacion"
                autocomplete="off">
            <label class="btn btn-outline-primary rounded-pill chip" for="chip-programacion">Programación</label>

            <input type="checkbox" class="btn-check" id="chip-Diseño" name="materia" value="Diseño" autocomplete="off">
            <label class="btn btn-outline-primary rounded-pill chip" for="chip-Diseño">Diseño</label>

            <input type="checkbox" class="btn-check" id="chip-Idiomas" name="materia" value="Idiomas"
                autocomplete="off">
            <label class="btn btn-outline-primary rounded-pill chip" for="chip-Idiomas">Idiomas</label>

            <input type="checkbox" class="btn-check" id="chip-Marketing" name="materia" value="Marketing"
                autocomplete="off">
            <label class="btn btn-outline-primary rounded-pill chip" for="chip-Marketing">Marketing</label>

            <input type="checkbox" class="btn-check" id="chip-Negocios" name="materia" value="Negocios"
                autocomplete="off">
            <label class="btn btn-outline-primary rounded-pill chip" for="chip-Negocios">Negocios</label>

            <input type="checkbox" class="btn-check" id="chip-otros" name="materia" value="otros" autocomplete="off">
            <label class="btn btn-outline-primary rounded-pill chip" for="chip-otros">Otros</label>

        </div>

        <!-- filtro de los cursos -->
        <div class=" bg-form-adorn border border-1 rounded-3 p-3 mt-4 ms-3" style="max-width: 20%;">
            <h4>Filtrar por</h4>
            <div class="form-field mt-4">
                <p>Temática</p>

                <div class="form-check">
                    <input type="checkbox" id="tematica-programacion" class="form-check-input" name="tematica"
                        value="programacion" />
                    <label class="form-check-label" for="tematica-programacion">Programación</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="tematica-diseno" class="form-check-input" name="tematica"
                        value="diseno" />
                    <label class="form-check-label" for="tematica-diseno">Diseño</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="tematica-idiomas" class="form-check-input" name="tematica"
                        value="idiomas" />
                    <label class="form-check-label" for="tematica-idiomas">Idiomas</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="tematica-marketing" class="form-check-input" name="tematica"
                        value="marketing" />
                    <label class="form-check-label" for="tematica-marketing">Marketing</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="tematica-negocios" class="form-check-input" name="tematica"
                        value="negocios" />
                    <label class="form-check-label" for="tematica-negocios">Negocios</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="tematica-otros" class="form-check-input" name="tematica" value="otros" />
                    <label class="form-check-label" for="tematica-otros">Otros</label>
                </div>
            </div>


            <div class="form-field mt-4">
                <p>Nivel</p>

                <div class="form-check">
                    <input type="checkbox" id="nivel-basico" class="form-check-input" name="nivel" value="basico" />
                    <label class="form-check-label" for="nivel-basico">Básico</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="nivel-intermedio" class="form-check-input" name="nivel"
                        value="intermedio" />
                    <label class="form-check-label" for="nivel-intermedio">Intermedio</label>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="nivel-avanzado" class="form-check-input" name="nivel" value="avanzado" />
                    <label class="form-check-label" for="nivel-avanzado">Avanzado</label>
                </div>
            </div>
        </div>

    </form>
